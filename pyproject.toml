[project]
name = "pheq"
version = "0.1.0"
description = "Photometric equivariance for diffusion tokenizers: analytic and learned latent color operators"
requires-python = ">=3.12"
dependencies = [
    "clean-fid>=0.1.35",
    "diffusers>=0.39.0",
    "lpips>=0.1.4",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "safetensors>=0.8.0",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

# Linux (Oscar): CUDA 12.9 wheels — the PyPI-default torch bundles CUDA 13,
# which needs a newer NVIDIA driver than Oscar's nodes have (12090 = 12.9).
# macOS keeps the default PyPI wheel (CPU/MPS).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pheq"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: long-running training smoke tests (deselect with -m 'not slow')"]
